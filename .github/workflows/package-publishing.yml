name: Publish signed package repositories
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release to include
        required: true
        default: v1.5.0
      flatpak_run:
        description: Successful main-branch Flatpak update candidate run (optional)
        type: string
        default: ''
      publish:
        description: Deploy production repository (requires main and environment approval)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: package-repositories
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-24.04
    outputs:
      flatpak: ${{ steps.flatpak.outputs.available }}
      flatpak_tag: ${{ steps.flatpak.outputs.tag }}
      candidate: ${{ steps.flatpak.outputs.candidate }}
    steps:
      - name: Check production source ref
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'release' || inputs.publish == true }}
        run: |
          if [[ "$PUBLISH_REQUESTED" == true && "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Production publication must be dispatched from main; do not rerun the old v1.5.0 release-event run.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Download and validate stable package inputs before signing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          if command -v rg >/dev/null; then
            echo '::notice title=Downloader prerequisites::ripgrep is present but is not a downloader dependency.'
          else
            echo '::notice title=Downloader prerequisites::ripgrep is absent; the legacy if-not-rg selector would silently skip every release.'
          fi
          bash scripts/ci-command.sh Repository-download node scripts/download-repository-assets.js "$RELEASE_TAG" incoming downloads
          printf '### Repository inputs verified\n\nSource commit: `%s`\n\nRequested release: `%s`\n\n' "$GITHUB_SHA" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          cat incoming/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Select verified candidate or newest complete public Flatpak release
        id: flatpak
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FLATPAK_RUN: ${{ inputs.flatpak_run }}
          EXPECTED_RELEASE: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if test -n "$FLATPAK_RUN"; then
            python3 scripts/download-flatpak-candidate.py "$FLATPAK_RUN" flatpak-incoming
            curl --retry 3 -fL https://github.com/fluffydisk/airdrop-linux/releases/download/v1.5.0/airdrop-linux-1.5.0-x86_64-reference-r2.flatpak -o flatpak-incoming/r2.flatpak
            echo '9dcc5d18450eb1404ce1615ebf4cf55dac03eeb09958dc4c767353dfd0cfb9df  flatpak-incoming/r2.flatpak' | sha256sum -c -
            echo candidate=true >> "$GITHUB_OUTPUT"
            python3 -c 'import json;print("v"+json.load(open("flatpak-incoming/candidate.json"))["version"])' > flatpak-incoming/tag.txt
            test "$(cat flatpak-incoming/tag.txt)" = "$EXPECTED_RELEASE"
          else
            node scripts/download-flatpak-assets.js flatpak-incoming
          fi
          if test -d flatpak-incoming; then
            echo available=true >> "$GITHUB_OUTPUT"
            printf 'tag=%s\n' "$(cat flatpak-incoming/tag.txt)" >> "$GITHUB_OUTPUT"
          else
            echo available=false >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.flatpak.outputs.available == 'true'
        with:
          name: flatpak-repository-inputs
          path: flatpak-incoming/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: repository-packages
          path: incoming/
          if-no-files-found: error
  verify:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && inputs.publish != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/download-artifact@v4
        with:
          name: repository-packages
          path: incoming
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.flatpak == 'true'
        with:
          name: flatpak-repository-inputs
          path: flatpak-incoming
      - name: Verify complete signing flow with a disposable key (no deployment)
        run: |
          set -euo pipefail
          sudo bash scripts/ci-ubuntu-mirror.sh
          sudo apt-get update
          sudo apt-get install -y apt-utils rpm createrepo-c gnupg gpgv flatpak ostree
          node scripts/verify-release-assets.js incoming
          export GNUPGHOME="$RUNNER_TEMP/test-signing"
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME" verified-repository' EXIT
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'Airdrop CI test <test@example.invalid>' ed25519 sign 1d
          export SIGNING_KEY_FINGERPRINT="$(gpg --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print $10;exit}')"
          bash scripts/ci-command.sh Repository-test-signing scripts/build-repository.sh incoming verified-repository
          if test -d flatpak-incoming; then
            if test -f flatpak-incoming/candidate.json; then
              python3 scripts/flatpak_channel.py --candidate flatpak-incoming --public verified-repository --fingerprint "$SIGNING_KEY_FINGERPRINT" --r2 flatpak-incoming/r2.flatpak
            else
              bash scripts/build-flatpak-repository.sh flatpak-incoming verified-repository
            fi
          fi
          echo '### Validation passed with real release assets and a disposable key; nothing deployed.' >> "$GITHUB_STEP_SUMMARY"
  repository:
    needs: prepare
    if: github.event_name == 'release' || inputs.publish == true
    runs-on: ubuntu-24.04
    environment: package-publishing
    outputs:
      fingerprint: ${{ steps.signing.outputs.fingerprint }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/download-artifact@v4
        with:
          name: repository-packages
          path: incoming
      - uses: actions/download-artifact@v4
        if: needs.prepare.outputs.flatpak == 'true'
        with:
          name: flatpak-repository-inputs
          path: flatpak-incoming
      - name: Verify staged checksums before accessing signing material
        run: node scripts/verify-release-assets.js incoming
      - name: Install repository tools
        run: |
          sudo bash scripts/ci-ubuntu-mirror.sh
          sudo apt-get update
          sudo apt-get install -y apt-utils rpm createrepo-c gnupg gpgv flatpak ostree
      - name: Install official signed repository linter before accessing keys
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.flatpak.Builder
      - name: Import protected signing key
        id: signing
        env:
          REPOSITORY_SIGNING_KEY: ${{ secrets.REPOSITORY_SIGNING_KEY }}
          REPOSITORY_SIGNING_PASSPHRASE: ${{ secrets.REPOSITORY_SIGNING_PASSPHRASE }}
          SIGNING_KEY_FINGERPRINT: ${{ vars.SIGNING_KEY_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPOSITORY_SIGNING_KEY" || { echo '::error::Missing protected REPOSITORY_SIGNING_KEY'; exit 1; }
          test -n "$SIGNING_KEY_FINGERPRINT" || { echo '::error::Missing public SIGNING_KEY_FINGERPRINT variable'; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/airdrop-signing"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$REPOSITORY_SIGNING_KEY" | gpg --batch --import
          passfile="$GNUPGHOME/passphrase"
          (umask 077; printf '%s' "$REPOSITORY_SIGNING_PASSPHRASE" > "$passfile")
          printf 'allow-preset-passphrase\ndefault-cache-ttl 7200\nmax-cache-ttl 7200\n' > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent
          printf 'probe' | gpg --batch --yes --pinentry-mode loopback --passphrase-file "$passfile" --local-user "$SIGNING_KEY_FINGERPRINT" --sign > "$GNUPGHOME/probe.gpg"
          rm "$passfile"
          printf 'GNUPGHOME=%s\n' "$GNUPGHOME" >> "$GITHUB_ENV"
          printf 'fingerprint=%s\n' "$SIGNING_KEY_FINGERPRINT" >> "$GITHUB_OUTPUT"
      - name: Build and verify signed APT and RPM repositories
        env:
          SIGNING_KEY_FINGERPRINT: ${{ vars.SIGNING_KEY_FINGERPRINT }}
        run: bash scripts/ci-command.sh Repository-build scripts/build-repository.sh incoming public
      - name: Include the signed Flatpak remote without changing native package inputs
        if: needs.prepare.outputs.flatpak == 'true'
        env:
          SIGNING_KEY_FINGERPRINT: ${{ vars.SIGNING_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          if test -f flatpak-incoming/candidate.json; then
            python3 scripts/flatpak_channel.py --candidate flatpak-incoming --public public --fingerprint "$SIGNING_KEY_FINGERPRINT" --r2 flatpak-incoming/r2.flatpak
          else
            status=0
            python3 scripts/preserve-flatpak-channel.py --public public --fingerprint "$SIGNING_KEY_FINGERPRINT" || status=$?
            if (( status == 2 )); then bash scripts/build-flatpak-repository.sh flatpak-incoming public
            elif (( status )); then exit "$status"; fi
          fi
          python3 scripts/check-pages-tree.py public
          runtime=$(mktemp -d "$RUNNER_TEMP/signed-lint-runtime.XXXXXX")
          XDG_RUNTIME_DIR="$runtime" dbus-run-session -- flatpak run --user --command=flatpak-builder-lint org.flatpak.Builder repo \
            --ref=app/io.github.fluffydisk.airdrop-linux/x86_64/stable "$PWD/public/flatpak"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
      - name: Remove signing material
        if: always()
        run: |
          export GNUPGHOME="$RUNNER_TEMP/airdrop-signing"
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
  flatpak-install:
    needs: [prepare, repository]
    if: needs.prepare.outputs.flatpak == 'true' && needs.prepare.outputs.candidate != 'true'
    uses: ./.github/workflows/flatpak-public-check.yml
    with:
      tag: ${{ needs.prepare.outputs.flatpak_tag }}
      fingerprint: ${{ needs.repository.outputs.fingerprint }}
  signed-flatpak-install:
    needs: [prepare, repository]
    if: needs.prepare.outputs.candidate == 'true'
    uses: ./.github/workflows/flatpak-channel-public-check.yml
