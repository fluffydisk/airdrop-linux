name: Complete original tested draft assets
on:
  workflow_dispatch:
    inputs:
      producer_run: {description: Original native release producer run, type: string, required: true}
      tag: {description: Existing unpublished release tag, type: string, required: true}
permissions:
  contents: write
  actions: read
jobs:
  complete-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCER_RUN: ${{ inputs.producer_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Verify the immutable tag and original successful architecture builds
        run: python3 scripts/repair-draft-assets.py "$PRODUCER_RUN" "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.producer_run }}
          pattern: linux-*
          merge-multiple: true
          path: release
      - name: Merge original update manifests
        run: node scripts/merge-release.js
      - name: Upload only missing assets and verify every existing digest
        run: python3 scripts/repair-draft-assets.py "$PRODUCER_RUN" "$RELEASE_TAG" release
