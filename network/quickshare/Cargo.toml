[package]
name = "airdrop-quickshare"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
rqs_lib = { path = "vendor/rqs_lib", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "sync", "signal", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace]
members = ["vendor/rqs_lib"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
