name: Prepare application release
on:
  pull_request:
    paths: ['package.json', '.github/workflows/release.yml', 'scripts/build-appimage.js', 'scripts/build-release.js']
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json', 'lib/**', 'desktop/**', 'packaging/appimage-tools.json', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested release (otherwise draft only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test "$GITHUB_EVENT_NAME" = pull_request; then
            echo build=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p 'require("./package.json").version')
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; preserving every asset and tag.'
            if test "$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true; then echo build=true >> "$GITHUB_OUTPUT"; else echo build=false >> "$GITHUB_OUTPUT"; fi
          else
            echo build=true >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install native packaging tools
        run: sudo bash scripts/ci-ubuntu-mirror.sh && sudo apt-get update && sudo apt-get install -y rpm lintian appstream xvfb dbus-x11 unzip
      - run: npm ci
      - name: Verify application and lockfile versions match
        run: node -e "const v=require('./package.json').version;for(const p of ['./desktop/package.json','./package-lock.json','./desktop/package-lock.json']){const x=require(p);if(x.version!==v||(x.packages&&x.packages[''].version!==v))throw Error('Version mismatch in '+p);}"
      - run: node --test tests/flatpak-version.test.js
      - run: npm test
      - run: npm ci --prefix desktop
      - run: npm run prepare-desktop
      - run: npm run package --prefix desktop
      - run: node scripts/build-release.js
      - run: node scripts/build-appimage.js
      - name: Exercise the actual AppImage contents with Chromium sandboxing
        timeout-minutes: 10
        run: |
          set -euo pipefail
          appimage=$(find "$PWD/release" -maxdepth 1 -name 'Airdrop-*.AppImage' -print -quit)
          test -n "$appimage"
          appimage_stage=$(mktemp -d "$RUNNER_TEMP/airdrop-appimage-test-XXXXXX")
          appimage_profile="$RUNNER_TEMP/airdrop-appimage-test.apparmor"
          profile_loaded=false
          cleanup() {
            if test "$profile_loaded" = true; then sudo apparmor_parser --remove "$appimage_profile"; fi
            rm -rf "$appimage_stage"
          }
          trap cleanup EXIT
          (cd "$appimage_stage" && "$appimage" --appimage-extract > /dev/null)
          appimage_executable="$appimage_stage/squashfs-root/usr/lib/airdrop/Airdrop"
          if command -v apparmor_parser >/dev/null && test -d /sys/kernel/security/apparmor; then
            node scripts/desktop-apparmor.js "$appimage_executable" > "$appimage_profile"
            sudo apparmor_parser --replace "$appimage_profile"
            profile_loaded=true
          fi
          APPIMAGE="$appimage" ELECTRON_PATH="$appimage_stage/squashfs-root/AppRun" xvfb-run -a dbus-run-session -- npm run test:desktop
          APPIMAGE="$appimage" ELECTRON_PATH="$appimage_stage/squashfs-root/AppRun" xvfb-run -a dbus-run-session -- npm run test:nearby-desktop
      - name: Build package-manager payloads
        run: |
          for channel in apt rpm aur flatpak snap; do node scripts/build-packages.js "$channel"; done
          lintian --fail-on error release/*.deb
          appstreamcli validate --no-net packaging/io.github.fluffydisk.airdrop-linux.metainfo.xml
          sudo apt-get install -y ./release/*.deb
          AIRDROP_CODE_DIR=/usr/lib/airdrop-linux node scripts/smoke-managed.js
          ELECTRON_PATH=/usr/lib/airdrop-linux/desktop/Airdrop xvfb-run -a dbus-run-session -- npm run test:desktop
          ELECTRON_PATH=/usr/lib/airdrop-linux/desktop/Airdrop xvfb-run -a dbus-run-session -- npm run test:desktop-updates
          ELECTRON_PATH=/usr/lib/airdrop-linux/desktop/Airdrop AIRDROP_TEST_OZONE=x11 xvfb-run -a dbus-run-session -- npm run test:desktop-connection
      - name: Verify real nearby device desktop transfers
        run: ELECTRON_PATH=/usr/lib/airdrop-linux/desktop/Airdrop xvfb-run -a dbus-run-session -- npm run test:nearby-desktop
      - name: Upgrade the actual public v1.6.8 DEB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get remove -y airdrop-linux
          bash scripts/test-deb-upgrade.sh
      - name: Verify mobile browsers and real free internet sharing
        if: matrix.arch == 'x64'
        run: |
          set -euo pipefail
          export CHROMIUM_PATH=$(command -v google-chrome || command -v chromium)
          npm run test:mobile
          node --test tests/guest-browser.cjs
          node scripts/test-tsnet-bootstrap.cjs desktop/core/bin/airdrop-tsnet
          AIRDROP_TEST_LIVE_INTERNET=1 node --test tests/internet-live.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: release/*
  draft:
    needs: [plan, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: node scripts/merge-release.js
      - run: node scripts/prepare-channels.js
      - name: Require source-matched Flatpak validation before tagging
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/await-flatpak-validation.py "$GITHUB_SHA"
      - name: Create immutable tag and draft release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # Tag creation by GITHUB_TOKEN does not trigger another tag workflow.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" > "$RUNNER_TEMP/tag.json" 2>/dev/null; then
              test "$(jq -r .object.sha "$RUNNER_TEMP/tag.json")" = "$GITHUB_SHA"
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$version" -f "sha=$GITHUB_SHA"
            fi
          else
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          notes="docs/releases/v$version.md"
          if gh release view "v$version" --json isDraft --jq .isDraft > "$RUNNER_TEMP/existing-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/existing-draft")" = true
            echo 'Reusing the existing draft without overwriting assets.'
          elif test -f "$notes"; then
            gh release create "v$version" release/*.zip release/*.tar.gz release/*.AppImage release/*.deb release/*.rpm release/install-prebuilt.sh release/SHA256SUMS release/airdrop-update.json --verify-tag --draft --title "Airdrop $version" --notes-file "$notes"
          else
            gh release create "v$version" release/*.zip release/*.tar.gz release/*.AppImage release/*.deb release/*.rpm release/install-prebuilt.sh release/SHA256SUMS release/airdrop-update.json --verify-tag --draft --title "Airdrop $version" --generate-notes
          fi
      - name: Complete original draft payloads without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/repair-draft-assets.py "$GITHUB_RUN_ID" "v$(node -p 'require("./package.json").version')" release
      - name: Verify draft update payloads before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-release-update.js --draft
      - name: Publish authorized stable release
        if: inputs.publish == true || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'fluffydisk/airdrop-linux')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$version" = 1.9.0
          gh release edit "v$version" --draft=false --latest
          node scripts/test-release-update.js --public
          # The tested Flatpak producer requests the combined protected publish.
