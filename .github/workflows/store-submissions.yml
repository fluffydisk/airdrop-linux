name: Prepare and submit store packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable version tag
        required: true
      channel:
        description: Submission channel
        type: choice
        options: [prepare, aur, flathub-check, flathub, snap]
        default: prepare
permissions:
  contents: read
jobs:
  prepare:
    if: inputs.channel != 'flathub-check' && inputs.channel != 'flathub'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Download and verify immutable channel payloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | any')" = false
          mkdir release
          gh release download "$RELEASE_TAG" --pattern 'airdrop-native-*.tar.gz' --pattern 'airdrop-flatpak-*.tar.gz' --pattern 'airdrop-snap-*.tar.gz' --pattern SHA256SUMS --dir release
          node scripts/verify-release-assets.js release
          node scripts/prepare-channels.js
      - uses: actions/upload-artifact@v4
        with:
          name: store-submissions
          path: release/submissions
          include-hidden-files: true
  aur-check:
    needs: prepare
    if: inputs.channel == 'aur'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: store-submissions
          path: submissions
      - name: Check canonical AUR metadata and source checksums
        run: |
          useradd -m builder
          chown -R builder:builder submissions
          runuser -u builder -- bash -c 'cd "$1"; makepkg --printsrcinfo > canonical; diff -u <(sort .SRCINFO) <(sort canonical); makepkg --verifysource' bash "$PWD/submissions/aur"
  aur:
    needs: [prepare, aur-check]
    if: inputs.channel == 'aur'
    runs-on: ubuntu-24.04
    environment: aur-publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: store-submissions
          path: submissions
      - name: Publish verified AUR recipe
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$AUR_SSH_KEY" && test -n "$AUR_KNOWN_HOSTS"
          mkdir -m 700 -p ~/.ssh
          (umask 077; printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_key; printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts)
          export GIT_SSH_COMMAND='ssh -i /home/runner/.ssh/aur_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          git clone ssh://aur@aur.archlinux.org/airdrop-linux-bin.git aur
          cp submissions/aur/PKGBUILD submissions/aur/.SRCINFO aur/
          git -C aur add PKGBUILD .SRCINFO
          git -C aur -c user.name='Airdrop Linux packaging' -c user.email='airdrop-linux@users.noreply.github.com' commit -m "Update to $RELEASE_TAG"
          git -C aur push origin HEAD
      - if: always()
        run: rm -f ~/.ssh/aur_key
  flathub-check:
    if: inputs.channel == 'flathub-check'
    runs-on: ubuntu-24.04
    environment: flathub-publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Verify environment bindings and fork write access without submitting
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          FLATHUB_FORK: ${{ vars.FLATHUB_FORK }}
        run: |
          bash scripts/ci-command.sh Flathub-access node scripts/check-flathub-access.js
  flathub:
    if: inputs.channel == 'flathub'
    runs-on: ubuntu-24.04
    steps:
      - name: Explain manual submission requirements
        run: |
          echo '::error::Automatic Flathub submission is disabled. Use flathub-check for access verification. Source builds and a human-authored manifest and manual submission are required; see docs/flathub-readiness.md.'
          exit 1
  snap:
    needs: prepare
    if: inputs.channel == 'snap'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    environment: snap-publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: store-submissions
          path: submissions
      - name: Install supported Snapcraft
        run: sudo snap install snapcraft --classic --channel=8.x/stable
      - name: Build and upload to candidate
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -n "$SNAPCRAFT_STORE_CREDENTIALS"
          mkdir -p snap
          cp "submissions/snap/snapcraft-$PACKAGE_ARCH.yaml" snap/snapcraft.yaml
          sudo snapcraft pack --destructive-mode
          snapcraft upload ./*.snap --release candidate
