name: Build and distribute Flatpak
on:
  pull_request:
    paths: ['packaging/**', 'scripts/*flatpak*', '.github/workflows/flatpak-distribution.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release
        default: v1.5.0
        required: true
      publish:
        description: Append validated Flatpak bundles to the release
        type: boolean
        default: false
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: flatpak-${{ github.event.pull_request.number || inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}
          persist-credentials: false
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || 'v1.5.0' }}
          PUBLISH: ${{ inputs.publish || github.event_name == 'release' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$PUBLISH" == true && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
          fi
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - if: github.event_name != 'pull_request'
        name: Refresh pinned release sources and offline dependency descriptions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/prepare-flatpak-release.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-inputs
          path: packaging/
          if-no-files-found: error
  build:
    needs: prepare
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-inputs
          path: packaging
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install test and Flatpak tools on the disposable VM
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y flatpak dbus-x11 xvfb weston appstream desktop-file-utils
          npm ci
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.flatpak.Builder org.freedesktop.Sdk//26.08 org.freedesktop.Platform//26.08 org.electronjs.Electron2.BaseApp//26.08 org.freedesktop.Sdk.Extension.node24//26.08 org.freedesktop.Sdk.Extension.rust-stable//26.08
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder/ccache
          key: flatpak-ccache-26.08-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: flatpak-ccache-26.08-${{ matrix.arch }}-
      - name: Download all checksum-pinned build inputs before compilation
        run: dbus-run-session -- flatpak run --command=flatpak-builder org.flatpak.Builder --download-only --disable-rofiles-fuse fetch-build packaging/io.github.fluffydisk.airdrop-linux.yml
      - name: Build with downloads disabled and network-isolated module commands
        run: dbus-run-session -- flatpak run --command=flathub-build org.flatpak.Builder --disable-download --disable-rofiles-fuse --ccache --jobs=2 --default-branch=stable --repo=flatpak-repo packaging/io.github.fluffydisk.airdrop-linux.yml
      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/io.github.fluffydisk.airdrop-linux.desktop
          appstreamcli validate --no-net packaging/io.github.fluffydisk.airdrop-linux.metainfo.xml
      - name: Flatpak manifest and repository lint
        id: lint
        continue-on-error: true
        run: |
          mkdir -p flatpak-lint
          status=0
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/io.github.fluffydisk.airdrop-linux.yml > flatpak-lint/manifest.txt 2>&1 || status=$?
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo flatpak-repo > flatpak-lint/repo.txt 2>&1 || status=$?
          cat flatpak-lint/*.txt
          exit "$status"
      - name: Create, install, and exercise the real bundle
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          FLATPAK_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release
          bundle="release/airdrop-linux-${RELEASE_TAG#v}-$FLATPAK_ARCH.flatpak"
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo flatpak-repo "$bundle" io.github.fluffydisk.airdrop-linux stable
          dbus-run-session -- flatpak install --user --noninteractive "$bundle"
          dbus-run-session -- node scripts/smoke-sandbox.js flatpak
          xvfb-run -a dbus-run-session -- node scripts/smoke-sandbox-desktop.cjs flatpak
          dbus-run-session -- bash scripts/test-flatpak-wayland.sh
          flatpak info --user --show-permissions io.github.fluffydisk.airdrop-linux
          flatpak uninstall --user --noninteractive io.github.fluffydisk.airdrop-linux
          (cd release && sha256sum *.flatpak > "FLATPAK-SHA256SUMS-$FLATPAK_ARCH")
      - name: Require lint success before distribution
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
        run: test "$LINT_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flatpak-lint-${{ matrix.arch }}
          path: flatpak-lint
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flatpak-*
          path: artifacts
      - name: Append both tested bundles without replacing any release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir upload
          for arch in x86_64 aarch64; do
            (cd "artifacts/flatpak-$arch" && sha256sum -c "FLATPAK-SHA256SUMS-$arch")
            cp "artifacts/flatpak-$arch/airdrop-linux-${RELEASE_TAG#v}-$arch.flatpak" upload/
          done
          (cd upload && sha256sum *.flatpak > FLATPAK-SHA256SUMS)
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease]|any')" = false
          # Deliberately omit --clobber: existing assets are immutable.
          gh release upload "$RELEASE_TAG" upload/*
