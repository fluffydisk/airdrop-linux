name: Prepare and submit store packages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable version tag
        required: true
      channel:
        description: Submission channel
        type: choice
        options: [prepare, aur-access, aur, flathub-check, flathub, snap-access, snap-validate, snap, snap-store]
        default: prepare
      candidate_run:
        description: Locally validated v1.5.0 candidate producer run (snap-store only)
        default: '39819533208'
      promote_stable:
        description: Release the verified candidate revisions to stable
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: store-${{ inputs.channel }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  snap-provenance:
    if: inputs.channel == 'snap-store'
    runs-on: ubuntu-24.04
    steps:
      - name: Require the reviewed v1.5.0 producer and both local acceptance gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRODUCER_RUN: ${{ inputs.candidate_run }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$PRODUCER_RUN" =~ ^[0-9]+$ ]]
          test "$RELEASE_TAG" = v1.5.0
          gh api "repos/$GH_REPO/actions/runs/$PRODUCER_RUN" > producer.json
          # This is the reviewed PR #9 tree, squash-merged as b6c94ab.
          # Upload jobs may fail while Store review is pending. Require the
          # actual build/installation tests; Store tests below still fail closed.
          jq -e '.status == "completed" and (.conclusion == "success" or .conclusion == "failure") and .event == "workflow_dispatch" and .path == ".github/workflows/store-submissions.yml" and .head_sha == "891dffac7036816534a2c5c5dddc21589e0a9b47"' producer.json
          gh api "repos/$GH_REPO/actions/runs/$PRODUCER_RUN/jobs?per_page=100" > jobs.json
          jq -e '[.jobs[] | select(.name == "snap (ubuntu-24.04, x64)" or .name == "snap (ubuntu-24.04-arm, arm64)") | select(.conclusion == "success")] | length == 2' jobs.json
  snap-candidate-check:
    needs: snap-provenance
    uses: ./.github/workflows/snap-store-check.yml
    with:
      channel: candidate
      producer_run: ${{ inputs.candidate_run }}
  snap-stable-release:
    needs: snap-candidate-check
    if: inputs.promote_stable
    runs-on: ubuntu-24.04
    environment: snap-publishing
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snap-store-candidate-*
          path: evidence
          merge-multiple: true
      - name: Validate the two successful installation records
        run: |
          set -euo pipefail
          jq -s -e 'length == 2 and (map(.arch) | sort == ["amd64","arm64"]) and all(.[]; .version == "1.5.0" and .channel == "candidate" and (.revision | test("^[0-9]+$")) and (.sha256 | test("^[a-f0-9]{64}$")))' evidence/*.json
      - name: Install supported Snapcraft
        run: sudo snap install snapcraft --classic --channel=8.x/stable
      - name: Release only the exact Store-tested revisions
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          test -n "$SNAPCRAFT_STORE_CREDENTIALS"
          for record in evidence/*.json; do
            revision=$(jq -r .revision "$record")
            snapcraft release airdrop-linux "$revision" latest/stable
          done
          snapcraft status airdrop-linux
  snap-stable-check:
    needs: snap-stable-release
    uses: ./.github/workflows/snap-store-check.yml
    with:
      channel: stable
      producer_run: ${{ inputs.candidate_run }}
  aur-access:
    if: inputs.channel == 'aur-access'
    runs-on: ubuntu-24.04
    environment: aur-publishing
    steps:
      - uses: actions/checkout@v4
      - name: Check AUR credentials and authenticated access without publishing
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          bash scripts/prepare-aur-known-hosts.sh "$keydir/known_hosts"
          if [[ -z "$AUR_SSH_KEY" ]]; then
            echo '::error::Missing AUR_SSH_KEY in aur-publishing or repository secrets'
            exit 1
          fi
          (umask 077; printf '%s\n' "$AUR_SSH_KEY" > "$keydir/key")
          ssh -i "$keydir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/known_hosts" aur@aur.archlinux.org list-repos
          echo 'AUR authentication passed; no package was pushed.' >> "$GITHUB_STEP_SUMMARY"
  snap-access:
    if: inputs.channel == 'snap-access'
    runs-on: ubuntu-24.04
    environment: snap-publishing
    steps:
      - uses: actions/checkout@v4
      - name: Check Snap Store credential binding before installing tools
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [[ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]]; then
            echo '::error::Missing SNAPCRAFT_STORE_CREDENTIALS in snap-publishing or repository secrets'
            exit 1
          fi
      - name: Install supported Snapcraft
        run: sudo snap install snapcraft --classic --channel=8.x/stable
      - name: Check store authentication and package access without uploading
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          snapcraft whoami
          snapcraft status airdrop-linux
          snapcraft revisions airdrop-linux
          echo 'Snap Store authentication and package access passed; nothing uploaded.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install the pinned official Store API client
        run: |
          python3 -m venv "$RUNNER_TEMP/snap-store-api"
          "$RUNNER_TEMP/snap-store-api/bin/pip" install craft-store==3.4.0
      - name: Inspect review status and revision digests without uploading
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: '"$RUNNER_TEMP/snap-store-api/bin/python" scripts/snap-store-state.py'
      - uses: actions/upload-artifact@v4
        with:
          name: snap-store-state
          path: snap-store-state.json
          if-no-files-found: error
  prepare:
    if: contains(fromJSON('["prepare", "aur", "snap-validate", "snap"]'), inputs.channel)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Download and verify immutable channel payloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | any')" = false
          mkdir release
          gh release download "$RELEASE_TAG" --pattern 'airdrop-native-*.tar.gz' --pattern 'airdrop-flatpak-*.tar.gz' --pattern 'airdrop-snap-*.tar.gz' --pattern SHA256SUMS --dir release
          node scripts/verify-release-assets.js release
          node scripts/prepare-channels.js
      - uses: actions/upload-artifact@v4
        with:
          name: store-submissions
          path: release/submissions
          include-hidden-files: true
  aur-check:
    needs: prepare
    if: inputs.channel == 'aur' || inputs.channel == 'prepare'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: store-submissions
          path: release/local-submissions
      - name: Build the public AUR sources, check canonical metadata, install and remove
        run: bash scripts/test-aur-package.sh
  aur:
    needs: [prepare, aur-check]
    if: inputs.channel == 'aur'
    runs-on: ubuntu-24.04
    environment: aur-publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: store-submissions
          path: submissions
      - name: Publish verified AUR recipe
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$AUR_SSH_KEY"
          mkdir -m 700 -p ~/.ssh
          bash scripts/prepare-aur-known-hosts.sh ~/.ssh/known_hosts
          (umask 077; printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_key)
          export GIT_SSH_COMMAND='ssh -i /home/runner/.ssh/aur_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          git clone ssh://aur@aur.archlinux.org/airdrop-linux-bin.git aur
          cp submissions/aur/PKGBUILD submissions/aur/.SRCINFO aur/
          git -C aur add PKGBUILD .SRCINFO
          git -C aur -c user.name='Airdrop Linux packaging' -c user.email='airdrop-linux@users.noreply.github.com' commit -m "Update to $RELEASE_TAG"
          git -C aur push origin HEAD
      - if: always()
        run: rm -f ~/.ssh/aur_key
  flathub-check:
    if: inputs.channel == 'flathub-check'
    runs-on: ubuntu-24.04
    environment: flathub-publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Verify environment bindings and fork write access without submitting
        env:
          GH_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
          FLATHUB_FORK: ${{ vars.FLATHUB_FORK }}
        run: |
          bash scripts/ci-command.sh Flathub-access node scripts/check-flathub-access.js
  flathub:
    if: inputs.channel == 'flathub'
    runs-on: ubuntu-24.04
    steps:
      - name: Explain manual submission requirements
        run: |
          echo '::error::Automatic Flathub submission is disabled. Use flathub-check for access verification. Source builds and a human-authored manifest and manual submission are required; see docs/flathub-readiness.md.'
          exit 1
  snap:
    needs: prepare
    if: inputs.channel == 'snap' || inputs.channel == 'snap-validate'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/download-artifact@v4
        with:
          name: store-submissions
          path: submissions
      - name: Install supported Snapcraft
        run: sudo snap install snapcraft --classic --channel=8.x/stable
      - run: npm ci
      - name: Build the immutable release payload
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p snap
          cp "submissions/snap/snapcraft-$PACKAGE_ARCH.yaml" snap/snapcraft.yaml
          sudo snapcraft pack --destructive-mode
      - name: Install and exercise this exact strict Snap before upload
        run: |
          set -euo pipefail
          sudo snap set system experimental.user-daemons=true
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user start snapd.session-agent.socket
          # This flag is only for our locally built, unsigned artifact. Store
          # assertions and strict confinement remain enabled for store installs.
          sudo snap install --dangerous ./*.snap
          systemctl --user daemon-reload
          snap run airdrop-linux.cli --help
          # Local artifacts cannot receive store-reviewed auto-connections.
          # Candidate installation still needs independent store verification.
          sudo snap connect airdrop-linux:browser-sandbox
          test -x /snap/airdrop-linux/current/lib/airdrop-linux/desktop/Airdrop
          node scripts/smoke-sandbox.js snap
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11
          sudo snap start --users=all airdrop-linux.backend
          xvfb-run -a node scripts/smoke-sandbox-desktop.cjs snap background
          xvfb-run -a node scripts/smoke-sandbox-desktop.cjs snap
      - name: Remove the disposable local test installation
        if: always()
        run: |
          if snap list airdrop-linux >/dev/null 2>&1; then
            sudo snap remove --purge airdrop-linux
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: validated-snap-${{ matrix.arch }}
          path: ./*.snap
          if-no-files-found: error
  snap-upload:
    needs: snap
    if: inputs.channel == 'snap'
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: ubuntu-24.04
    environment: snap-publishing
    steps:
      - name: Check publication credentials
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: test -n "$SNAPCRAFT_STORE_CREDENTIALS"
      - uses: actions/download-artifact@v4
        with:
          name: validated-snap-${{ matrix.arch }}
      - name: Install supported Snapcraft
        run: sudo snap install snapcraft --classic --channel=8.x/stable
      - name: Upload the tested artifact to candidate after both architectures pass
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          snapcraft upload ./*.snap --release latest/candidate
