<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Airdrop</title>
<link rel="manifest" href="/ui/manifest.json">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Airdrop">
<link rel="apple-touch-icon" href="/ui/icon-192.png">
<style>
  [hidden] { display: none !important; }
  button { cursor: pointer; }
  #sendPanel button, #downloadZip { padding: 10px 14px; margin: 8px 4px; border: 0; border-radius: 10px; background: var(--blue); color: white; font: inherit; font-size: 14px; }
  #sendPanel button:disabled, #downloadZip:disabled { opacity: .45; cursor: default; }
  #sendPanel #sendCancel { background: var(--card-pressed); color: var(--label); }
  #fileListCard a { text-decoration: none; color: var(--label); }
  #fileListCard a:hover { color: var(--blue); }
  input[type=checkbox] { accent-color: var(--blue); }
  #sendHint { color: var(--tertiary-label); font-size: 14px; }
  #sendNames { overflow-wrap: anywhere; }
  .row-label { overflow-wrap: anywhere; min-width: 0; }
  .file-selection { margin-right: 12px; }

  :root {
    --bg: #F2F2F7;
    --grouped-bg: #F2F2F7;
    --card: #FFFFFF;
    --card-pressed: #E5E5EA;
    --label: #000000;
    --secondary-label: #3C3C43;
    --tertiary-label: #8E8E93;
    --separator: rgba(60,60,67,0.29);
    --blue: #007AFF;
    --green: #34C759;
    --red: #FF3B30;
    --nav-bg: rgba(242,242,247,0.94);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --grouped-bg: #000000;
      --card: #1C1C1E;
      --card-pressed: #2C2C2E;
      --label: #FFFFFF;
      --secondary-label: #EBEBF5;
      --tertiary-label: #8E8E93;
      --separator: rgba(84,84,88,0.65);
      --nav-bg: rgba(0,0,0,0.85);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    min-height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--label);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    -webkit-font-smoothing: antialiased;
  }

  /* Nav bar */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 10;
    padding-top: env(safe-area-inset-top, 0px);
    background: var(--nav-bg);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 0.5px solid var(--separator);
  }
  .navbar-inner {
    padding: 6px 16px 12px;
  }
  .navbar-title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-align: center;
    height: 0;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .navbar.scrolled .navbar-title { opacity: 1; height: auto; margin-bottom: 2px; }

  .large-title {
    padding: 4px 16px 8px;
  }
  .large-title h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .large-title p {
    margin: 2px 0 0;
    font-size: 15px;
    color: var(--tertiary-label);
  }

  .content { padding: 0 16px; max-width: 640px; margin: 0 auto; }

  /* Grouped section */
  .section { margin-top: 24px; }
  .section-header {
    font-size: 13px;
    font-weight: 400;
    color: var(--tertiary-label);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    padding: 0 16px 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .refresh-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--blue);
    padding: 0;
    display: flex;
    align-items: center;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
  }
  .refresh-btn svg {
    width: 16px; height: 16px;
    transition: transform 0.4s ease;
  }
  .refresh-btn.spinning svg {
    animation: spin 0.6s linear;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .section-footer {
    font-size: 13px;
    color: var(--tertiary-label);
    padding: 6px 16px 0;
  }
  .card {
    background: var(--card);
    border-radius: 10px;
    overflow: hidden;
  }

  /* Rows */
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    min-height: 44px;
    position: relative;
    text-decoration: none;
    color: var(--label);
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    cursor: pointer;
  }
  .row:active { background: var(--card-pressed); }
  .row + .row::before {
    content: '';
    position: absolute;
    top: 0; left: 16px; right: 0;
    height: 0.5px;
    background: var(--separator);
  }
  .row-icon {
    width: 29px; height: 29px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: #fff;
  }
  .row-icon.blue { background: var(--blue); }
  .row-icon.green { background: var(--green); }
  .row-icon svg { width: 17px; height: 17px; }
  .row-label {
    flex: 1;
    min-width: 0;
    font-size: 17px;
  }
  .row-value {
    font-size: 17px;
    color: var(--tertiary-label);
    max-width: 40%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chevron {
    width: 8px; height: 14px;
    flex-shrink: 0;
    color: #C7C7CC;
  }
  .row-title-icon {
    width: 22px; height: 22px;
    color: var(--tertiary-label);
    flex-shrink: 0;
  }

  /* Destructive / accent text rows */
  .row.accent .row-label { color: var(--blue); }
  .row.destructive .row-label { color: var(--red); }

  /* Toggle */
  .switch {
    position: relative;
    width: 51px; height: 31px;
    flex-shrink: 0;
    border-radius: 16px;
    background: #E9E9EB;
    transition: background 0.2s ease;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .switch.on { background: var(--green); }
  .switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 27px; height: 27px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.1);
    transition: transform 0.2s ease;
  }
  .switch.on::after { transform: translateX(20px); }

  /* Status text under groups */
  .status {
    text-align: center;
    font-size: 13px;
    color: var(--tertiary-label);
    margin: 10px 0 0;
    min-height: 16px;
  }
  .status.ok { color: var(--green); }
  .status.err { color: var(--red); }

  #fileInput { display: none; }

  .empty-row {
    padding: 20px 16px;
    text-align: center;
    color: var(--tertiary-label);
    font-size: 15px;
  }

  /* Incoming file sheet (native alert-like) */
  .sheet-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet-backdrop.show { display: flex; }
  .sheet-backdrop {
    padding: 0 8px calc(env(safe-area-inset-bottom, 0px) + 8px);
  }
  .sheet {
    width: 100%;
    max-width: 640px;
    background: transparent;
    border-radius: 0;
    padding: 0;
    text-align: center;
    animation: sheet-up 0.25s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @keyframes sheet-up {
    from { transform: translateY(30%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .sheet-icon {
    width: 52px; height: 52px;
    margin: 0 auto 14px;
    border-radius: 12px;
    background: var(--blue);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .sheet-message {
    background: var(--card);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-radius: 14px;
    padding: 20px 20px 16px;
    margin-bottom: 8px;
  }
  .sheet-message h3 {
    margin: 0 0 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--tertiary-label);
  }
  .sheet-message p {
    margin: 0;
    font-size: 13px;
    color: var(--tertiary-label);
  }
  .sheet-actions {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .sheet-btn {
    display: block;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--blue);
    font-size: 20px;
    font-weight: 600;
    padding: 16px;
    cursor: pointer;
    position: relative;
  }
  .sheet-btn:active { background: var(--card-pressed); }
  .sheet-btn + .sheet-btn::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 0.5px;
    background: var(--separator);
  }
  .sheet-btn.primary { font-weight: 700; }
  .sheet-cancel {
    display: block;
    width: 100%;
    border: none;
    background: var(--card);
    color: var(--blue);
    font-size: 20px;
    font-weight: 700;
    padding: 16px;
    border-radius: 14px;
    cursor: pointer;
  }
  .sheet-cancel:active { background: var(--card-pressed); }

  /* Buttons row (segmented style at top for quick actions) */
  .quick-actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }
  .quick-btn {
    flex: 1;
    border: none;
    background: var(--card);
    border-radius: 12px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--blue);
    cursor: pointer;
  }
  .quick-btn:active { background: var(--card-pressed); }
  .quick-btn svg { width: 22px; height: 22px; }
</style>
<link rel="stylesheet" href="explorer.css">
</head>
<body>
  <div class="navbar" id="navbar">
    <div class="navbar-inner">
      <div class="navbar-title">Airdrop</div>
    </div>
  </div>

  <div class="large-title">
    <h1>Airdrop</h1>
  </div>

  <div class="content" id="scrollArea">

    <div class="section">
      <div class="card">
        <div class="quick-actions" style="padding:12px;">
          <button class="quick-btn" id="uploadBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M5 12l7-7 7 7"/><path d="M5 21h14"/></svg>
            Upload
          </button>
          <button class="quick-btn" id="browseBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6l2 3h8v11H4z"/></svg>
            Files
          </button>
          <button class="quick-btn" id="clipPaste">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
            Paste
          </button>
          <button class="quick-btn" id="clipCopy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy
          </button>
        </div>
      </div>
      <div class="status" id="status"></div>
      <div class="status" id="clipSub"></div>
      <div id="clipManual" hidden>
        <label for="clipText">Shared text (manual copy/paste on HTTP or when clipboard permission is unavailable)</label>
        <textarea id="clipText" rows="4" style="width:100%;box-sizing:border-box" spellcheck="false"></textarea>
        <button class="quick-btn" id="clipSendText">Send text</button>
      </div>
    </div>

    <input type="file" id="fileInput" multiple>
    <div class="section"><label><input type="checkbox" id="sendZip"> Upload as one ZIP (up to 100 MiB)</label><p>Files upload immediately into the open folder.</p><button id="reloadApp" hidden>New version available — reload</button></div>
    <div class="section" id="sendPanel" hidden>
      <div class="section-header">Failed transfer</div>
      <div class="card" style="padding:16px">
        <ul id="sendNames"></ul>
        <p id="sendHint" role="status"></p>
        <button id="sendConfirm">Retry failed files</button>
        <button id="sendCancel">Discard failed transfer</button>
      </div>
    </div>

    <div class="section" id="notifySection" style="display:none;">
      <div class="section-header">Notifications</div>
      <div class="card">
        <div class="row">
          <div class="row-icon blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div class="row-label">New File Notifications</div>
          <button class="switch" id="notifySwitch"></button>
        </div>
      </div>
      <div class="section-footer">You will receive a notification when a new file is added.</div>
    </div>

    <div class="section">
      <div class="section-header">
        <span>Shared files</span>
        <button class="refresh-btn" id="refreshBtn" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
      <div class="card" id="fileListCard">
        <div class="empty-row">No files yet.</div>
      </div>
    </div>

  </div>

  <div class="sheet-backdrop" id="incomingBackdrop">
    <div class="sheet">
      <div class="sheet-message">
        <div class="sheet-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        </div>
        <h3 id="incomingName">file.pdf</h3>
        <p>A new file was added</p>
      </div>
      <div class="sheet-actions">
        <button class="sheet-btn primary" id="incomingAccept">Accept</button>
      </div>
      <button class="sheet-cancel" id="incomingReject">Reject</button>
    </div>
  </div>

<script src="vendor/jszip.min.js"></script>
<script src="zip.js"></script>
<script src="pending-share.js"></script>
<script src="explorer.js"></script>
<script src="app.js"></script>
</body>
</html>
