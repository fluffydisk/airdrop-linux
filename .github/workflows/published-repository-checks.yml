name: Published repository validation
on:
  workflow_dispatch:
  push:
    branches: [codex/verify-published-repositories]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Verify public signatures and package provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-command.sh Published-metadata python3 scripts/verify-published-repository.py
  install:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        distro:
          - {image: 'debian:13', format: apt}
          - {image: 'ubuntu:24.04', format: apt}
          - {image: 'ubuntu:26.04', format: apt}
          - {image: 'fedora:43', format: dnf}
          - {image: 'fedora:44', format: dnf}
          - {image: 'opensuse/tumbleweed:latest', format: zypper}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install, exercise, reinstall and remove from the public repository
        env:
          TEST_IMAGE: ${{ matrix.distro.image }}
          PACKAGE_FORMAT: ${{ matrix.distro.format }}
        run: bash scripts/ci-command.sh Published-install docker run --rm -v "$PWD:/work:ro" -w /work -e PACKAGE_FORMAT "$TEST_IMAGE" bash scripts/test-published-repository.sh
  desktop:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install the public package with its fingerprint-checked key
        run: |
          set -euo pipefail
          curl -fsSL https://fluffydisk.github.io/airdrop-linux/airdrop-linux.gpg -o "$RUNNER_TEMP/airdrop-linux.gpg"
          fingerprint=$(gpg --batch --with-colons --show-keys "$RUNNER_TEMP/airdrop-linux.gpg" | awk -F: '$1=="fpr" {print $10;exit}')
          test "$fingerprint" = 6513D70958397F60D3787A0CB93F4FC1E97CF3AE
          sudo install -Dm644 "$RUNNER_TEMP/airdrop-linux.gpg" /etc/apt/keyrings/airdrop-linux.gpg
          echo 'deb [signed-by=/etc/apt/keyrings/airdrop-linux.gpg] https://fluffydisk.github.io/airdrop-linux/apt stable main' | sudo tee /etc/apt/sources.list.d/airdrop-linux.list
          sudo apt-get update
          sudo apt-get install -y airdrop-linux xvfb dbus-x11 desktop-file-utils appstream
          test "$(dpkg-query -W -f='${Version}' airdrop-linux)" = 1.5.0-1
      - name: Validate installed desktop integration and exercise the published Electron binary
        run: |
          set -euo pipefail
          desktop-file-validate /usr/share/applications/io.github.fluffydisk.*.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.fluffydisk.*.metainfo.xml
          npm ci
          ELECTRON_PATH=/usr/lib/airdrop-linux/desktop/Airdrop bash scripts/ci-command.sh Published-desktop xvfb-run -a dbus-run-session -- npm run test:desktop
      - name: Remove the public package
        if: always()
        run: sudo apt-get remove -y airdrop-linux
